<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hello! I'm JiaYi (Maggie) Ma</title>
  <desc id="desc">Computer Engineering at the University of Waterloo. A type-led banner using the portfolio's dark background and emerald-to-pink accent.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="358" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <path d="M 0 331 H 1200" stroke="url(#accent)" stroke-width="4"/>
    <path d="M 558 62 H 642" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <text x="600" y="92" text-anchor="middle" fill="#94a3b8" font-family="'Fira Code', 'DejaVu Sans Mono', monospace" font-size="15" letter-spacing="2">ENGINEERING  /  CREATIVE SYSTEMS</text>
    <text x="600" y="161" text-anchor="middle" fill="#f1f5f9" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">Hello! I'm JiaYi</text>
    <text x="600" y="224" text-anchor="middle" fill="url(#name)" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">(Maggie) Ma</text>
    <text x="600" y="276" text-anchor="middle" fill="#f1f5f9" font-family="'Fira Code', 'DejaVu Sans Mono', monospace" font-size="20">Computer Engineering @ University of Waterloo</text>
    <path d="M 352 299 H 848" stroke="#94a3b8" stroke-opacity=".25" stroke-width="1"/>
    <circle cx="352" cy="299" r="3" fill="#10b981"/>
    <circle cx="848" cy="299" r="3" fill="#ec4899"/>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="22" fill="none" stroke="#94a3b8" stroke-opacity=".20" stroke-width="2"/>
</svg>
